name: build-web

# 合并到 master 后：构建前端 dist -> 打成 frank-web 镜像（自带 nginx 路由）-> 推 GHCR
# 服务器侧 poll-deploy.sh 会自动拉新镜像重启，链接不变
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        run: |
          npm install --legacy-peer-deps
          npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # 接口加密密钥建议放 GitHub Secrets 注入，不要提交进仓库：
          # REACT_APP_API_ENCRYPT_REQUEST_KEY: ${{ secrets.API_ENCRYPT_REQUEST_KEY }}
          # REACT_APP_API_ENCRYPT_RESPONSE_KEY: ${{ secrets.API_ENCRYPT_RESPONSE_KEY }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frank-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/ifrrrank/frank-web:latest
            ghcr.io/ifrrrank/frank-web:${{ github.sha }}
