# 与本地 nginx 等价的 Docker 版：单入口 80 端口
# /  serve 前端静态文件；各业务路径按本地规则直连对应微服务容器（全路径透传，与本地一致）
server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;
    resolver 127.0.0.11 valid=30s;

    # ---- 性能优化：gzip 压缩 + 静态资源长缓存 ----
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /nacos/ {
        proxy_pass http://nacos:8848/nacos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ /system/    { set $upstream http://system:48081; proxy_pass $upstream; }
    location ~ /infra/    { set $upstream http://infra:48082; proxy_pass $upstream; }
    location ~ /bpm/    { set $upstream http://bpm:48083; proxy_pass $upstream; }
    location ~ /pay/    { set $upstream http://pay:48085; proxy_pass $upstream; }
    location ~ /member/    { set $upstream http://member:48087; proxy_pass $upstream; }
    location ~ /erp/    { set $upstream http://erp:48088; proxy_pass $upstream; }
    location ~ /crm/    { set $upstream http://crm:48089; proxy_pass $upstream; }
    location ~ /hrm/    { set $upstream http://hrm:48094; proxy_pass $upstream; }
    location ~ /fms/    { set $upstream http://fms:48092; proxy_pass $upstream; }
    location ~ /product/    { set $upstream http://product:48100; proxy_pass $upstream; }
    location ~ /promotion/    { set $upstream http://promotion:48101; proxy_pass $upstream; }
    location ~ /trade/    { set $upstream http://trade:48102; proxy_pass $upstream; }
    location ~ /statistics/    { set $upstream http://statistics:48103; proxy_pass $upstream; }

    # 带哈希的静态资源长缓存（放在 API 规则之后，nginx 按顺序匹配正则 location）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
