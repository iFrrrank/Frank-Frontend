# 与本地 nginx 等价的 Docker 版：单入口 80 端口
# /  serve 前端静态文件；各业务路径按本地规则直连对应微服务容器（全路径透传，与本地一致）
server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /nacos/ {
        proxy_pass http://nacos:8848/nacos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ /system/    { proxy_pass http://system:48081; }
    location ~ /infra/     { proxy_pass http://infra:48082; }
    location ~ /bpm/       { proxy_pass http://bpm:48083; }
    location ~ /pay/       { proxy_pass http://pay:48085; }
    location ~ /member/    { proxy_pass http://member:48087; }
    location ~ /erp/       { proxy_pass http://erp:48088; }
    location ~ /crm/       { proxy_pass http://crm:48089; }
    location ~ /hrm/       { proxy_pass http://hrm:48094; }
    location ~ /fms/       { proxy_pass http://fms:48092; }
    location ~ /product/   { proxy_pass http://product:48100; }
    location ~ /promotion/ { proxy_pass http://promotion:48101; }
    location ~ /trade/     { proxy_pass http://trade:48102; }
    location ~ /statistics/ { proxy_pass http://statistics:48103; }
}
